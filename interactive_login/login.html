<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassicAuto &mdash; Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Ambient background glows -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <div class="login-wrapper">

        <!-- ═══════════════ MASCOT ═══════════════ -->
        <div class="mascot-container" id="mascot">

            <!-- Antenna -->
            <div class="antenna">
                <div class="antenna-ball"></div>
            </div>

            <!-- Face -->
            <div class="face" id="face">

                <!-- Car-themed side mirrors -->
                <div class="mirror mirror-left"></div>
                <div class="mirror mirror-right"></div>

                <!-- Eyes -->
                <div class="eyes-row">
                    <!-- Left Eye -->
                    <div class="eye" id="left-eye">
                        <div class="pupil" id="left-pupil">
                            <div class="pupil-shine"></div>
                        </div>
                        <div class="eyelid top-lid" id="left-top-lid"></div>
                        <div class="eyelid bottom-lid" id="left-bottom-lid"></div>
                    </div>

                    <!-- Right Eye -->
                    <div class="eye" id="right-eye">
                        <div class="pupil" id="right-pupil">
                            <div class="pupil-shine"></div>
                        </div>
                        <div class="eyelid top-lid" id="right-top-lid"></div>
                        <div class="eyelid bottom-lid" id="right-bottom-lid"></div>
                    </div>
                </div>

                <!-- Nose -->
                <div class="nose"></div>

                <!-- Mouth -->
                <div class="mouth" id="mouth"></div>

                <!-- Blush cheeks -->
                <div class="cheek cheek-left"></div>
                <div class="cheek cheek-right"></div>

                <!-- Hands (appear on password focus) -->
                <div class="shy-hands" id="shy-hands">
                    <span class="hand hand-left">&#x1F91A;</span>
                    <span class="hand hand-right">&#x270B;</span>
                </div>
            </div><!-- /face -->

            <!-- Speech bubble -->
            <div class="speech-bubble" id="speech-bubble">
                <span id="speech-text"></span>
            </div>

        </div><!-- /mascot -->

        <!-- ═══════════════ LOGIN CARD ═══════════════ -->
        <div class="login-card">

            <div class="card-brand">
                <svg class="brand-icon" viewBox="0 0 32 18" fill="none">
                    <!-- Simple car silhouette icon -->
                    <rect x="1" y="8" width="30" height="8" rx="3" fill="#8b5cf6" />
                    <path d="M6 8 Q9 2 16 2 Q23 2 26 8Z" fill="#7c3aed" />
                    <circle cx="8" cy="16" r="3" fill="#1e1b4b" />
                    <circle cx="24" cy="16" r="3" fill="#1e1b4b" />
                </svg>
                <span class="brand-name">ClassicAuto</span>
            </div>

            <div class="card-header">
                <h1>Welcome Back</h1>
                <p>Sign in to your account to continue</p>
            </div>

            <form id="login-form" novalidate>

                <!-- Email -->
                <div class="field-group">
                    <label for="email">Email address</label>
                    <div class="input-wrap">
                        <span class="field-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                <polyline points="22,6 12,13 2,6" />
                            </svg>
                        </span>
                        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
                    </div>
                </div>

                <!-- Password -->
                <div class="field-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <span class="field-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input type="password" id="password"
                            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
                            autocomplete="current-password">
                        <button type="button" id="toggle-pw" class="toggle-pw" aria-label="Toggle password">
                            <svg id="pw-eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Extras row -->
                <div class="extras-row">
                    <label class="remember-label">
                        <input type="checkbox" id="remember"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-signin" id="btn-signin">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-icon">&#8594;</span>
                </button>

                <p class="register-row">
                    Don't have an account? <a href="#">Create one</a>
                </p>

            </form>
        </div><!-- /login-card -->

    </div><!-- /login-wrapper -->

    <script src="script.js"></script>
</body>

</html>
