<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – ClassicAuto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
        rel="stylesheet">
    <script>
        // Session Guard: Prevent navigating back to authenticated pages after logout
        function preventBack() { window.history.forward(); }
        setTimeout("preventBack()", 0);
        window.onunload = function () { null };
    </script>
    <style>
        /* ── Variables matching Register page ── */
        :root {
            --vintage-dark: #3e2723;
            --vintage-brown: #5d4037;
            --vintage-light: #d7ccc8;
            --vintage-gold: #c9a96e;
            --vintage-gold-dark: #b89446;
            --vintage-cream: #f5f1e6;
            --vintage-red: #8b4513;
            --transition: all 0.4s ease;
        }

        /* ── Custom Cursor ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important;
        }

        /* The custom cursor element */
        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-4px, -4px);
            transition: transform 0.05s linear;
        }

        #custom-cursor svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.4));
        }

        /* Cursor dot (trailing) */
        #cursor-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background: var(--vintage-gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background 0.2s;
        }

        /* ── Body & Background ── */
        body {
            font-family: 'Lora', serif;
            color: var(--vintage-dark);
            background-color: var(--vintage-cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%235d4037' fill-opacity='0.04' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        /* ── Outer Card ── */
        .login-card {
            display: flex;
            width: 860px;
            min-height: 540px;
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(62, 39, 35, 0.2), 0 0 0 1px rgba(201, 169, 110, 0.15);
            position: relative;
        }

        /* ══════════════════════════════
           LEFT PANEL — Characters
        ══════════════════════════════ */
        .left-panel {
            width: 44%;
            background: linear-gradient(160deg, var(--vintage-dark) 0%, #5a3520 55%, var(--vintage-brown) 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0 0 0 0;
            position: relative;
            overflow: hidden;
        }

        /* Decorative gold circles like register page */
        .left-panel::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 2px solid rgba(201, 169, 110, 0.12);
            top: -70px;
            right: -70px;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 2px solid rgba(201, 169, 110, 0.1);
            bottom: -50px;
            left: -50px;
        }

        /* Panel title text */
        .panel-title {
            position: absolute;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            white-space: nowrap;
        }

        .panel-title .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(201, 169, 110, 0.15);
            border: 1px solid rgba(201, 169, 110, 0.4);
            color: var(--vintage-gold);
            padding: 5px 14px;
            border-radius: 2px;
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Scene container */
        .scene {
            position: relative;
            width: 300px;
            height: 370px;
            flex-shrink: 0;
            z-index: 2;
        }

        /* ────────────────────────────
           CHARACTER BASE ANIMATIONS
        ──────────────────────────── */
        @keyframes bob-slow {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes bob-mid {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        @keyframes bob-fast {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes sway-left {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(-4deg);
            }
        }

        @keyframes sway-right {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(4deg);
            }
        }

        @keyframes peek-up {

            0%,
            40%,
            100% {
                transform: translateY(0px) scaleY(1);
            }

            20% {
                transform: translateY(-18px) scaleY(1.04);
            }
        }

        @keyframes squish {

            0%,
            100% {
                transform: scaleX(1) scaleY(1);
            }

            50% {
                transform: scaleX(1.06) scaleY(0.94);
            }
        }

        /* ── Character: Purple (tallest, leftmost) ── */
        .char-purple {
            position: absolute;
            left: 14px;
            bottom: 0;
            width: 88px;
            height: 242px;
            background: #7c3aed;
            border-radius: 44px 44px 6px 6px;
            z-index: 1;
            transform-origin: bottom center;
            animation: bob-slow 3.2s ease-in-out infinite, sway-left 4.8s ease-in-out infinite;
        }

        .char-purple .eyes-row {
            position: absolute;
            top: 38px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
        }

        /* ── Character: Black (centre-back) ── */
        .char-black {
            position: absolute;
            left: 88px;
            bottom: 0;
            width: 74px;
            height: 210px;
            background: #1a1a2e;
            border-radius: 37px 37px 6px 6px;
            z-index: 2;
            transform-origin: bottom center;
            animation: peek-up 5s ease-in-out infinite;
        }

        .char-black .eyes-row {
            position: absolute;
            top: 34px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        /* ── Character: Orange (round blob) ── */
        .char-orange {
            position: absolute;
            left: 24px;
            bottom: 0;
            width: 120px;
            height: 114px;
            background: #f97316;
            border-radius: 50%;
            z-index: 3;
            transform-origin: bottom center;
            animation: squish 2.6s ease-in-out infinite;
        }

        /* Dot eyes on orange */
        .char-orange .orange-eye {
            position: absolute;
            width: 11px;
            height: 11px;
            background: #1a1a2e;
            border-radius: 50%;
            top: 36px;
        }

        .char-orange .orange-eye.left {
            left: 28px;
        }

        .char-orange .orange-eye.right {
            left: 60px;
        }

        /* Small pupil inside orange eye */
        .char-orange .orange-eye .pupil {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.08s linear;
        }

        /* ── Character: Yellow (right-front) ── */
        .char-yellow {
            position: absolute;
            right: 28px;
            bottom: 0;
            width: 74px;
            height: 152px;
            background: #d4a017;
            border-radius: 37px 37px 8px 8px;
            z-index: 4;
            transform-origin: bottom center;
            animation: bob-fast 2.4s ease-in-out infinite, sway-right 3.6s ease-in-out infinite;
        }

        .char-yellow .eyes-row {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 9px;
        }

        /* ── Generic eye ── */
        .eye {
            width: 17px;
            height: 17px;
            background: white;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .char-black .eye {
            width: 13px;
            height: 13px;
        }

        .char-yellow .eye {
            width: 13px;
            height: 13px;
        }

        .pupil {
            width: 9px;
            height: 9px;
            background: #2a0a0a;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.08s linear;
        }

        .char-black .pupil {
            width: 7px;
            height: 7px;
        }

        .char-yellow .pupil {
            width: 7px;
            height: 7px;
        }

        /* Snap class for look-away animation */
        .pupil.snap {
            transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Eyelid overlay for shy mode */
        .eyelid {
            position: absolute;
            width: 100%;
            left: 0;
            z-index: 2;
            transition: height 0.3s ease;
        }

        .char-purple .eyelid {
            background: #7c3aed;
        }

        .char-black .eyelid {
            background: #1a1a2e;
        }

        .char-yellow .eyelid {
            background: #d4a017;
        }

        .eyelid.top {
            top: 0;
            height: 0;
        }

        .eyelid.bottom {
            bottom: 0;
            height: 0;
        }

        .scene.shy .eyelid.top {
            height: 54%;
        }

        .scene.shy .eyelid.bottom {
            height: 54%;
        }

        /* Ground shadow strip */
        .ground-shadow {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 16px;
            background: rgba(0, 0, 0, 0.18);
            border-radius: 50%;
            filter: blur(6px);
        }

        /* ══════════════════════════════
           RIGHT PANEL — Form
        ══════════════════════════════ */
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 50px;
            background: var(--vintage-cream);
        }

        .form-inner {
            width: 100%;
            max-width: 330px;
        }

        /* Brand icon */
        .brand-star {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--vintage-gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-star i {
            color: var(--vintage-gold);
        }

        .brand-star::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--vintage-light);
        }

        .form-inner h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--vintage-dark);
            margin-bottom: 6px;
        }

        .form-inner .subtitle {
            font-size: 0.9rem;
            color: var(--vintage-brown);
            font-style: italic;
            margin-bottom: 28px;
        }

        /* Error / warn alerts */
        .alert-msg {
            padding: 10px 14px;
            border-radius: 2px;
            font-size: 0.85rem;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-msg.error {
            background: #fff3e0;
            color: var(--vintage-red);
            border: 1px solid #ffcc80;
            border-left: 4px solid var(--vintage-red);
        }

        .alert-msg.warn {
            background: #fff8e1;
            color: #795548;
            border: 1px solid #ffe082;
            border-left: 4px solid var(--vintage-gold);
        }

        /* Field groups */
        .field-group {
            margin-bottom: 20px;
        }

        .field-group label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--vintage-brown);
            margin-bottom: 7px;
        }

        .field-group input[type="email"],
        .field-group input[type="password"],
        .field-group input[type="text"] {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid var(--vintage-light);
            padding: 9px 0;
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            color: var(--vintage-dark);
            outline: none;
            background: transparent;
            transition: border-color 0.3s ease;
        }

        .field-group input:focus {
            border-bottom-color: var(--vintage-gold);
        }

        .field-group input::placeholder {
            color: #a89080;
            font-style: italic;
        }

        /* Password wrapper */
        .pw-wrap {
            position: relative;
        }

        .pw-wrap input {
            padding-right: 36px;
        }

        .pw-toggle {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--vintage-light);
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .pw-toggle:hover {
            color: var(--vintage-gold);
        }

        /* Options row */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0 26px;
            font-size: 0.82rem;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--vintage-brown);
        }

        .remember-label input[type=checkbox] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid var(--vintage-brown);
            border-radius: 2px;
            background: #faf8f2;
            position: relative;
            cursor: none;
            transition: var(--transition);
        }

        .remember-label input[type=checkbox]:checked {
            background: var(--vintage-gold);
            border-color: var(--vintage-gold-dark);
        }

        .remember-label input[type=checkbox]:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 9px;
            color: var(--vintage-dark);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .forgot-link {
            color: var(--vintage-gold-dark);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.82rem;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--vintage-dark);
        }

        /* Log In button */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--vintage-brown);
            border: none;
            border-radius: 2px;
            color: var(--vintage-cream);
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: background 0.3s ease, transform 0.15s ease, box-shadow 0.3s ease;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: var(--transition);
        }

        .btn-login:hover {
            background: var(--vintage-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(62, 39, 35, 0.3);
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Google button */
        .btn-google {
            width: 100%;
            padding: 13px;
            background: white;
            border: 1.5px solid var(--vintage-light);
            border-radius: 2px;
            color: var(--vintage-brown);
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-google:hover {
            background: #faf8f2;
            border-color: var(--vintage-gold);
            box-shadow: 0 2px 8px rgba(201, 169, 110, 0.2);
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        /* Register footer */
        .register-footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--vintage-brown);
            margin-top: 20px;
            font-style: italic;
        }

        .register-footer a {
            color: var(--vintage-gold-dark);
            font-weight: 600;
            font-style: normal;
            text-decoration: none;
            transition: color 0.2s;
        }

        .register-footer a:hover {
            color: var(--vintage-dark);
        }

        /* ── Gold divider ── */
        .gold-divider {
            width: 40px;
            height: 2px;
            background: var(--vintage-gold);
            margin: 0 0 20px 0;
        }

        /* ── Responsive ── */
        @media (max-width: 720px) {
            .login-card {
                flex-direction: column;
                width: 96vw;
            }

            .left-panel {
                width: 100%;
                height: 220px;
                align-items: center;
            }

            .right-panel {
                padding: 32px 28px;
            }

            .scene {
                transform: scale(0.65);
                transform-origin: bottom center;
            }
        }

        /* hover pulse on chars */
        .char-purple:hover,
        .char-black:hover,
        .char-orange:hover,
        .char-yellow:hover {
            filter: brightness(1.15);
        }
    </style>
</head>

<body>

    <!-- Custom Cursor -->
    <div id="custom-cursor">
        <!-- Vintage arrow cursor SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path d="M5 3L19 12L12 13.5L9 20L5 3Z" fill="#3e2723" stroke="#c9a96e" stroke-width="1.5"
                stroke-linejoin="round" />
        </svg>
    </div>
    <div id="cursor-dot"></div>

    <div class="login-card">

        <!-- ═══════════ LEFT PANEL: Characters ═══════════ -->
        <div class="left-panel">
            <div class="panel-title">
                <div class="badge"><i class="fas fa-star" style="font-size:0.7rem"></i> ClassicAuto</div>
            </div>

            <div class="scene" id="scene">

                <!-- Purple character -->
                <div class="char-purple">
                    <div class="eyes-row">
                        <div class="eye">
                            <div class="pupil" id="pp-l"></div>
                            <div class="eyelid top"></div>
                            <div class="eyelid bottom"></div>
                        </div>
                        <div class="eye">
                            <div class="pupil" id="pp-r"></div>
                            <div class="eyelid top"></div>
                            <div class="eyelid bottom"></div>
                        </div>
                    </div>
                </div>

                <!-- Black character -->
                <div class="char-black">
                    <div class="eyes-row">
                        <div class="eye">
                            <div class="pupil" id="pb-l"></div>
                            <div class="eyelid top"></div>
                            <div class="eyelid bottom"></div>
                        </div>
                        <div class="eye">
                            <div class="pupil" id="pb-r"></div>
                            <div class="eyelid top"></div>
                            <div class="eyelid bottom"></div>
                        </div>
                    </div>
                </div>

                <!-- Orange blob (has real pupil divs) -->
                <div class="char-orange">
                    <div class="orange-eye left">
                        <div class="pupil" id="po-l"></div>
                    </div>
                    <div class="orange-eye right">
                        <div class="pupil" id="po-r"></div>
                    </div>
                </div>

                <!-- Yellow character -->
                <div class="char-yellow">
                    <div class="eyes-row">
                        <div class="eye">
                            <div class="pupil" id="py-l"></div>
                            <div class="eyelid top"></div>
                            <div class="eyelid bottom"></div>
                        </div>
                        <div class="eye">
                            <div class="pupil" id="py-r"></div>
                            <div class="eyelid top"></div>
                            <div class="eyelid bottom"></div>
                        </div>
                    </div>
                </div>

                <!-- Ground shadow -->
                <div class="ground-shadow"></div>

            </div><!-- /scene -->
        </div><!-- /left-panel -->

        <!-- ═══════════ RIGHT PANEL: Form ═══════════ -->
        <div class="right-panel">
            <div class="form-inner">

                <div class="brand-star">
                    <i class="fas fa-car-side"></i> ClassicAuto
                </div>

                <h1>Welcome back!</h1>
                <p class="subtitle">Please enter your details</p>
                <div class="gold-divider"></div>

                {% if msg == 'Invalid' %}
                <div class="alert-msg error">
                    <i class="fas fa-exclamation-circle"></i>
                    Invalid email or password. Please try again.
                </div>
                {% elif msg == 'New Seller' %}
                <div class="alert-msg warn">
                    <i class="fas fa-hourglass-half"></i>
                    Your seller account is pending admin approval.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <!-- Email -->
                    <div class="field-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"
                            required>
                    </div>

                    <!-- Password -->
                    <div class="field-group">
                        <label for="password">Password</label>
                        <div class="pw-wrap">
                            <input type="password" id="password" name="password" placeholder="••••••••"
                                autocomplete="current-password" required>
                            <button type="button" class="pw-toggle" id="pwToggle"
                                aria-label="Toggle password visibility">
                                <i class="fas fa-eye" id="pwIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember + Forgot -->
                    <div class="options-row">
                        <label class="remember-label">
                            <input type="checkbox" id="remember">
                            Remember me for 30 days
                        </label>
                        <a href="/forgot-password/" class="forgot-link">Forgot password?</a>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn-login">Log In</button>



                </form>

                <p class="register-footer">
                    Don't have an account? <a href="/register/">Sign Up</a>
                </p>

            </div>
        </div><!-- /right-panel -->

    </div><!-- /login-card -->

    <script>
        'use strict';

        /* ─────────────────────────────────────────
           CUSTOM CURSOR
        ───────────────────────────────────────── */
        const cursor = document.getElementById('custom-cursor');
        const cursorDot = document.getElementById('cursor-dot');

        let mouseX = 0, mouseY = 0;
        let dotX = 0, dotY = 0;

        document.addEventListener('mousemove', function (e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
        });

        // Smooth trailing dot
        function animateDot() {
            dotX += (mouseX - dotX) * 0.18;
            dotY += (mouseY - dotY) * 0.18;
            cursorDot.style.left = dotX + 'px';
            cursorDot.style.top = dotY + 'px';
            requestAnimationFrame(animateDot);
        }
        animateDot();

        // Cursor scale on hoverable elements
        document.querySelectorAll('a, button, input, label, .char-purple, .char-black, .char-orange, .char-yellow')
            .forEach(el => {
                el.addEventListener('mouseenter', () => {
                    cursorDot.style.width = '16px';
                    cursorDot.style.height = '16px';
                    cursorDot.style.background = 'rgba(201,169,110,0.5)';
                });
                el.addEventListener('mouseleave', () => {
                    cursorDot.style.width = '6px';
                    cursorDot.style.height = '6px';
                    cursorDot.style.background = 'var(--vintage-gold)';
                });
            });

        /* ─────────────────────────────────────────
           EYE TRACKING
        ───────────────────────────────────────── */
        const scene = document.getElementById('scene');
        const passwordEl = document.getElementById('password');
        const pwToggleBtn = document.getElementById('pwToggle');
        const pwIcon = document.getElementById('pwIcon');

        const MAX_OFFSET = 5;
        let isShyMode = false;

        function eyeCenter(eyeEl) {
            const r = eyeEl.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }

        function aimPupil(pupilEl, eyeEl, tx, ty) {
            const { x: ex, y: ey } = eyeCenter(eyeEl);
            const dx = tx - ex;
            const dy = ty - ey;
            const dist = Math.hypot(dx, dy);
            const scale = dist > 0 ? Math.min(MAX_OFFSET, dist / 8) / dist : 0;
            const px = dx * scale;
            const py = dy * scale;
            pupilEl.style.transform = `translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;
        }

        function aimAll(tx, ty) {
            document.querySelectorAll('.scene .eye, .scene .orange-eye').forEach(eyeEl => {
                const pupil = eyeEl.querySelector('.pupil');
                if (pupil) aimPupil(pupil, eyeEl, tx, ty);
            });
        }

        function snapAll(offsetX, offsetY) {
            document.querySelectorAll('.scene .pupil').forEach(p => {
                p.classList.add('snap');
                p.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
                setTimeout(() => p.classList.remove('snap'), 450);
            });
        }

        function centreAll() {
            document.querySelectorAll('.scene .pupil').forEach(p => {
                p.classList.add('snap');
                p.style.transform = 'translate(-50%, -50%)';
                setTimeout(() => p.classList.remove('snap'), 450);
            });
        }

        /* Mouse tracking */
        document.addEventListener('mousemove', function (e) {
            if (isShyMode) return;
            aimAll(e.clientX, e.clientY);
        });

        /* Email field → look at it */
        document.getElementById('email').addEventListener('focus', function () {
            if (isShyMode) return;
            const r = this.getBoundingClientRect();
            aimAll(r.left + r.width / 2, r.top + r.height / 2);
        });

        /* Password field → shy mode */
        passwordEl.addEventListener('focus', function () {
            isShyMode = true;
            scene.classList.add('shy');
            snapAll(MAX_OFFSET, -MAX_OFFSET);
        });

        passwordEl.addEventListener('blur', function () {
            isShyMode = false;
            scene.classList.remove('shy');
            centreAll();
        });

        /* Password toggle */
        pwToggleBtn.addEventListener('click', function () {
            const isHidden = passwordEl.type === 'password';
            passwordEl.type = isHidden ? 'text' : 'password';
            pwIcon.className = isHidden ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        /* ─────────────────────────────────────────
           CHARACTER CLICK REACTIONS
        ───────────────────────────────────────── */
        function addClickReaction(selector, anim, duration) {
            const el = document.querySelector(selector);
            if (!el) return;
            el.addEventListener('click', () => {
                el.style.animation = 'none';
                el.style.transform = 'scale(1.12) rotate(-6deg)';
                setTimeout(() => {
                    el.style.transform = '';
                    el.style.animation = '';
                }, duration || 300);
            });
        }

        addClickReaction('.char-purple', null, 350);
        addClickReaction('.char-black', null, 300);
        addClickReaction('.char-orange', null, 280);
        addClickReaction('.char-yellow', null, 320);
    </script>

</body>

</html>
