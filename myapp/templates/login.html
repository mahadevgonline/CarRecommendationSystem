<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – ClassicAuto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ── Reset ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #e8e8e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Outer card ── */
        .login-card {
            display: flex;
            width: 820px;
            min-height: 520px;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.14);
        }

        /* ══════════════════════════════
           LEFT PANEL — Characters
        ══════════════════════════════ */
        .left-panel {
            width: 42%;
            background: #f0ede8;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0 0 0 0;
            position: relative;
            overflow: hidden;
        }

        /* Scene container */
        .scene {
            position: relative;
            width: 280px;
            height: 360px;
            flex-shrink: 0;
        }

        /* ── Character: Purple (tallest, leftmost) ── */
        .char-purple {
            position: absolute;
            left: 14px;
            bottom: 0;
            width: 88px;
            height: 238px;
            background: #7c3aed;
            border-radius: 44px 44px 6px 6px;
            z-index: 1;
        }

        .char-purple .eyes-row {
            position: absolute;
            top: 38px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
        }

        /* ── Character: Black (behind centre) ── */
        .char-black {
            position: absolute;
            left: 88px;
            bottom: 0;
            width: 74px;
            height: 208px;
            background: #1a1a2e;
            border-radius: 37px 37px 6px 6px;
            z-index: 2;
        }

        .char-black .eyes-row {
            position: absolute;
            top: 34px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        /* ── Character: Orange (round blob) ── */
        .char-orange {
            position: absolute;
            left: 24px;
            bottom: 0;
            width: 118px;
            height: 112px;
            background: #f97316;
            border-radius: 50%;
            z-index: 3;
        }

        /* Static dot eyes on orange */
        .char-orange::before,
        .char-orange::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #1a1a2e;
            border-radius: 50%;
            top: 36px;
        }

        .char-orange::before {
            left: 28px;
        }

        .char-orange::after {
            left: 58px;
        }

        /* ── Character: Yellow (right, front) ── */
        .char-yellow {
            position: absolute;
            right: 24px;
            bottom: 0;
            width: 74px;
            height: 148px;
            background: #d4a017;
            border-radius: 37px 37px 8px 8px;
            z-index: 4;
        }

        .char-yellow .eyes-row {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 9px;
        }

        /* ── Generic eye ── */
        .eye {
            width: 17px;
            height: 17px;
            background: white;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Smaller eyes for black character */
        .char-black .eye {
            width: 13px;
            height: 13px;
        }

        .char-yellow .eye {
            width: 13px;
            height: 13px;
        }

        .pupil {
            width: 9px;
            height: 9px;
            background: #111;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.08s linear;
        }

        .char-black .pupil {
            width: 7px;
            height: 7px;
        }

        .char-yellow .pupil {
            width: 7px;
            height: 7px;
        }

        /* Snap class for animating look-away */
        .pupil.snap {
            transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Shy mode: eyes "close" via eyelid overlay */
        .eyelid {
            position: absolute;
            width: 100%;
            background: inherit;
            left: 0;
            z-index: 2;
            transition: height 0.3s ease;
        }

        .char-purple .eyelid {
            background: #7c3aed;
        }

        .char-black .eyelid {
            background: #1a1a2e;
        }

        .char-yellow .eyelid {
            background: #d4a017;
        }

        .eyelid.top {
            top: 0;
            height: 0;
        }

        .eyelid.bottom {
            bottom: 0;
            height: 0;
        }

        .scene.shy .eyelid.top {
            height: 54%;
        }

        .scene.shy .eyelid.bottom {
            height: 54%;
        }

        /* ══════════════════════════════
           RIGHT PANEL — Form
        ══════════════════════════════ */
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 50px;
        }

        .form-inner {
            width: 100%;
            max-width: 320px;
        }

        /* Star / logo icon */
        .brand-star {
            font-size: 1.6rem;
            margin-bottom: 22px;
            display: block;
        }

        .form-inner h1 {
            font-size: 1.85rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 6px;
        }

        .form-inner .subtitle {
            font-size: 0.88rem;
            color: #6b7280;
            margin-bottom: 28px;
        }

        /* Error / info alerts */
        .alert-msg {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 18px;
        }

        .alert-msg.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 3px solid #ef4444;
        }

        .alert-msg.warn {
            background: #fef3c7;
            color: #92400e;
            border-left: 3px solid #f59e0b;
        }

        /* Field groups */
        .field-group {
            margin-bottom: 20px;
        }

        .field-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .field-group input[type="email"],
        .field-group input[type="password"],
        .field-group input[type="text"] {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid #d1d5db;
            padding: 9px 0;
            font-size: 0.95rem;
            color: #111;
            outline: none;
            background: transparent;
            transition: border-color 0.2s ease;
        }

        .field-group input:focus {
            border-bottom-color: #111;
        }

        .field-group input::placeholder {
            color: #9ca3af;
        }

        /* Password wrapper */
        .pw-wrap {
            position: relative;
        }

        .pw-wrap input {
            padding-right: 36px;
        }

        .pw-toggle {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .pw-toggle:hover {
            color: #374151;
        }

        /* Options row */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0 26px;
            font-size: 0.82rem;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #6b7280;
            cursor: pointer;
        }

        .remember-label input[type=checkbox] {
            accent-color: #111;
            width: 14px;
            height: 14px;
        }

        .forgot-link {
            color: #374151;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Log In button */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #111;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
            margin-bottom: 12px;
        }

        .btn-login:hover {
            background: #333;
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Google button */
        .btn-google {
            width: 100%;
            padding: 13px;
            background: white;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            color: #374151;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .btn-google:hover {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        /* Register footer */
        .register-footer {
            text-align: center;
            font-size: 0.82rem;
            color: #6b7280;
            margin-top: 20px;
        }

        .register-footer a {
            color: #111;
            font-weight: 700;
            text-decoration: none;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }

        /* ── Responsive ── */
        @media (max-width: 680px) {
            .login-card {
                flex-direction: column;
                width: 96vw;
            }

            .left-panel {
                width: 100%;
                height: 200px;
                align-items: center;
            }

            .right-panel {
                padding: 32px 28px;
            }

            .scene {
                transform: scale(0.6);
                transform-origin: bottom center;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <!-- ═══════════ LEFT PANEL: Characters ═══════════ -->
        <div class="left-panel">
            <div class="scene" id="scene">

                <!-- Purple character -->
                <div class="char-purple">
                    <div class="eyes-row">
                        <div class="eye">
                            <div class="pupil" id="pp-l"></div>
                            <div class="eyelid top"></div>
                            <div class="eyelid bottom"></div>
                        </div>
                        <div class="eye">
                            <div class="pupil" id="pp-r"></div>
                            <div class="eyelid top"></div>
                            <div class="eyelid bottom"></div>
                        </div>
                    </div>
                </div>

                <!-- Black character -->
                <div class="char-black">
                    <div class="eyes-row">
                        <div class="eye">
                            <div class="pupil" id="pb-l"></div>
                            <div class="eyelid top"></div>
                            <div class="eyelid bottom"></div>
                        </div>
                        <div class="eye">
                            <div class="pupil" id="pb-r"></div>
                            <div class="eyelid top"></div>
                            <div class="eyelid bottom"></div>
                        </div>
                    </div>
                </div>

                <!-- Orange blob (static dots as eyes via CSS ::before/::after) -->
                <div class="char-orange"></div>

                <!-- Yellow character -->
                <div class="char-yellow">
                    <div class="eyes-row">
                        <div class="eye">
                            <div class="pupil" id="py-l"></div>
                            <div class="eyelid top"></div>
                            <div class="eyelid bottom"></div>
                        </div>
                        <div class="eye">
                            <div class="pupil" id="py-r"></div>
                            <div class="eyelid top"></div>
                            <div class="eyelid bottom"></div>
                        </div>
                    </div>
                </div>

            </div><!-- /scene -->
        </div><!-- /left-panel -->

        <!-- ═══════════ RIGHT PANEL: Form ═══════════ -->
        <div class="right-panel">
            <div class="form-inner">

                <span class="brand-star">&#10022;</span>

                <h1>Welcome back!</h1>
                <p class="subtitle">Please enter your details</p>

                {% if msg == 'Invalid' %}
                <div class="alert-msg error">
                    <i class="fas fa-exclamation-circle"></i>
                    Invalid email or password. Please try again.
                </div>
                {% elif msg == 'New Seller' %}
                <div class="alert-msg warn">
                    <i class="fas fa-hourglass-half"></i>
                    Your seller account is pending admin approval.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <!-- Email -->
                    <div class="field-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"
                            required>
                    </div>

                    <!-- Password -->
                    <div class="field-group">
                        <label for="password">Password</label>
                        <div class="pw-wrap">
                            <input type="password" id="password" name="password" placeholder="••••••••"
                                autocomplete="current-password" required>
                            <button type="button" class="pw-toggle" id="pwToggle"
                                aria-label="Toggle password visibility">
                                <i class="fas fa-eye" id="pwIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember + Forgot -->
                    <div class="options-row">
                        <label class="remember-label">
                            <input type="checkbox" id="remember">
                            Remember me for 30 days
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn-login">Log In</button>

                    <!-- Google (UI only) -->
                    <button type="button" class="btn-google">
                        <svg viewBox="0 0 24 24">
                            <path fill="#4285F4"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                            <path fill="#EA4335"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        </svg>
                        Log in with Google
                    </button>

                </form>

                <p class="register-footer">
                    Don't have an account? <a href="/register/">Sign Up</a>
                </p>

            </div>
        </div><!-- /right-panel -->

    </div><!-- /login-card -->

    <script>
        'use strict';

        /* ── References ──────────────────────────────── */
        const scene = document.getElementById('scene');
        const passwordEl = document.getElementById('password');
        const pwToggleBtn = document.getElementById('pwToggle');
        const pwIcon = document.getElementById('pwIcon');

        // All trackable pupils (id → element)
        const pupils = {
            'pp-l': document.getElementById('pp-l'),
            'pp-r': document.getElementById('pp-r'),
            'pb-l': document.getElementById('pb-l'),
            'pb-r': document.getElementById('pb-r'),
            'py-l': document.getElementById('py-l'),
            'py-r': document.getElementById('py-r'),
        };

        // Max offset (px) a pupil can drift
        const MAX_OFFSET = 5;
        let isShyMode = false;

        /* ── Helpers ─────────────────────────────────── */
        function eyeCenter(eyeEl) {
            const r = eyeEl.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }

        /**
         * Move a pupil toward (tx, ty) in screen space,
         * clamped to MAX_OFFSET px from eye centre.
         */
        function aimPupil(pupilEl, eyeEl, tx, ty) {
            const { x: ex, y: ey } = eyeCenter(eyeEl);
            const dx = tx - ex;
            const dy = ty - ey;
            const dist = Math.hypot(dx, dy);
            const scale = dist > 0 ? Math.min(MAX_OFFSET, dist / 8) / dist : 0;
            const px = dx * scale;
            const py = dy * scale;
            pupilEl.style.transform = `translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;
        }

        /** Aim all trackable characters' pupils at a screen point. */
        function aimAll(tx, ty) {
            document.querySelectorAll('.scene .eye').forEach(eyeEl => {
                const pupil = eyeEl.querySelector('.pupil');
                if (pupil) aimPupil(pupil, eyeEl, tx, ty);
            });
        }

        /** Snap pupils to a fixed offset (animated). */
        function snapAll(offsetX, offsetY) {
            Object.values(pupils).forEach(p => {
                if (!p) return;
                p.classList.add('snap');
                p.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
                setTimeout(() => p.classList.remove('snap'), 450);
            });
        }

        /** Reset pupils to centre. */
        function centreAll() {
            Object.values(pupils).forEach(p => {
                if (!p) return;
                p.classList.add('snap');
                p.style.transform = 'translate(-50%, -50%)';
                setTimeout(() => p.classList.remove('snap'), 450);
            });
        }

        /* ── Mouse tracking ──────────────────────────── */
        document.addEventListener('mousemove', function (e) {
            if (isShyMode) return;
            aimAll(e.clientX, e.clientY);
        });

        /* ── Email field: look at the input ─────────── */
        document.getElementById('email').addEventListener('focus', function () {
            if (isShyMode) return;
            const r = this.getBoundingClientRect();
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;
            // Snap once toward email input, then resume free tracking on mousemove
            aimAll(cx, cy);
        });

        /* ── Password field: shy mode ───────────────── */
        passwordEl.addEventListener('focus', function () {
            isShyMode = true;
            scene.classList.add('shy');         // closes eyelids via CSS
            snapAll(MAX_OFFSET, -MAX_OFFSET);   // pupils dart up-right (looking away)
        });

        passwordEl.addEventListener('blur', function () {
            isShyMode = false;
            scene.classList.remove('shy');
            centreAll();
            // Next mousemove will resume natural tracking
        });

        /* ── Password visibility toggle ─────────────── */
        pwToggleBtn.addEventListener('click', function () {
            const isHidden = passwordEl.type === 'password';
            passwordEl.type = isHidden ? 'text' : 'password';
            pwIcon.className = isHidden ? 'fas fa-eye-slash' : 'fas fa-eye';
        });
    </script>

</body>

</html>
