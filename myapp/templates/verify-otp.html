<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP – ClassicAuto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --vintage-dark: #3e2723;
            --vintage-brown: #5d4037;
            --vintage-light: #d7ccc8;
            --vintage-gold: #c9a96e;
            --vintage-gold-dark: #b89446;
            --vintage-cream: #f5f1e6;
            --vintage-red: #8b4513;
            --transition: all 0.4s ease;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important;
        }

        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-4px, -4px);
            transition: transform 0.05s linear;
        }

        #custom-cursor svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.4));
        }

        #cursor-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background: var(--vintage-gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background 0.2s;
        }

        body {
            font-family: 'Lora', serif;
            color: var(--vintage-dark);
            background-color: var(--vintage-cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%235d4037' fill-opacity='0.04' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .auth-card {
            width: 480px;
            background: #fff;
            border-radius: 4px;
            padding: 50px 40px;
            box-shadow: 0 24px 60px rgba(62, 39, 35, 0.2), 0 0 0 1px rgba(201, 169, 110, 0.15);
            text-align: center;
        }

        .brand-star {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--vintage-gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--vintage-dark);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--vintage-brown);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        /* OTP Box Inputs */
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .otp-inputs input {
            width: 50px;
            height: 58px;
            border: none;
            border-bottom: 2px solid var(--vintage-light);
            border-radius: 4px 4px 0 0;
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: var(--vintage-dark);
            background: #fdf9f3;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
        }

        .otp-inputs input:focus {
            border-bottom-color: var(--vintage-gold);
            background: #fff;
        }

        /* Real hidden input */
        #otp-hidden {
            display: none;
        }

        .field-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .field-group label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--vintage-brown);
            margin-bottom: 7px;
        }

        .otp-label {
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--vintage-brown);
            display: block;
            margin-bottom: 12px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--vintage-brown);
            border: none;
            border-radius: 2px;
            color: var(--vintage-cream);
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: background 0.3s ease, transform 0.15s ease, box-shadow 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: var(--transition);
        }

        .btn-submit:hover {
            background: var(--vintage-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(62, 39, 35, 0.3);
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .alert-msg {
            padding: 14px;
            border-radius: 2px;
            font-size: 0.9rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            text-align: left;
            gap: 10px;
            line-height: 1.4;
        }

        .alert-msg.error {
            background: #fff3e0;
            color: var(--vintage-red);
            border: 1px solid #ffcc80;
            border-left: 4px solid var(--vintage-red);
        }

        .timer-text {
            font-size: 0.85rem;
            color: var(--vintage-brown);
            margin-bottom: 18px;
        }

        .timer-text span {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: var(--vintage-red);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--vintage-gold-dark);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--vintage-dark);
        }

        @media (max-width: 600px) {
            .auth-card {
                width: 92vw;
                padding: 35px 25px;
            }

            .otp-inputs input {
                width: 40px;
                height: 50px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <div id="custom-cursor">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path d="M5 3L19 12L12 13.5L9 20L5 3Z" fill="#3e2723" stroke="#c9a96e" stroke-width="1.5"
                stroke-linejoin="round" />
        </svg>
    </div>
    <div id="cursor-dot"></div>

    <div class="auth-card">
        <div class="brand-star">
            <i class="fas fa-car-side"></i> ClassicAuto
        </div>

        <h1>Enter OTP</h1>
        <p class="subtitle">
            We've sent a <strong>6-digit OTP</strong> to <strong>{{ email }}</strong>.<br>
            Enter it below to continue. Valid for <strong>10 minutes</strong>.
        </p>

        {% if error %}
        <div class="alert-msg error">
            <i class="fas fa-exclamation-circle" style="font-size: 1.2rem;"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <form method="post" id="otp-form">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="otp" id="otp-hidden">

            <span class="otp-label">Your 6-Digit OTP</span>
            <div class="otp-inputs">
                <input type="text" maxlength="1" class="otp-box" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="otp-box" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="otp-box" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="otp-box" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="otp-box" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="otp-box" inputmode="numeric" autocomplete="off">
            </div>

            <p class="timer-text">Time remaining: <span id="timer">10:00</span></p>

            <button type="submit" class="btn-submit" id="verify-btn">
                Verify OTP <i class="fas fa-shield-alt" style="margin-left: 5px;"></i>
            </button>
        </form>

        <a href="/forgot-password/" class="back-link"><i class="fas fa-arrow-left"></i> Didn't receive it? Try again</a>
    </div>

    <script>
        'use strict';

        /* ── Custom Cursor ── */
        const cursor = document.getElementById('custom-cursor');
        const cursorDot = document.getElementById('cursor-dot');
        let mouseX = 0, mouseY = 0, dotX = 0, dotY = 0;
        document.addEventListener('mousemove', e => {
            mouseX = e.clientX; mouseY = e.clientY;
            cursor.style.left = mouseX + 'px'; cursor.style.top = mouseY + 'px';
        });
        function animateDot() {
            dotX += (mouseX - dotX) * 0.18; dotY += (mouseY - dotY) * 0.18;
            cursorDot.style.left = dotX + 'px'; cursorDot.style.top = dotY + 'px';
            requestAnimationFrame(animateDot);
        }
        animateDot();
        document.querySelectorAll('a, button, input, label').forEach(el => {
            el.addEventListener('mouseenter', () => { cursorDot.style.width = '16px'; cursorDot.style.height = '16px'; cursorDot.style.background = 'rgba(201,169,110,0.5)'; });
            el.addEventListener('mouseleave', () => { cursorDot.style.width = '6px'; cursorDot.style.height = '6px'; cursorDot.style.background = 'var(--vintage-gold)'; });
        });

        /* ── OTP Box Auto-focus ── */
        const boxes = document.querySelectorAll('.otp-box');
        boxes.forEach((box, idx) => {
            box.addEventListener('input', () => {
                const val = box.value.replace(/\D/g, '');
                box.value = val;
                if (val && idx < boxes.length - 1) {
                    boxes[idx + 1].focus();
                }
                syncHidden();
            });
            box.addEventListener('keydown', e => {
                if (e.key === 'Backspace' && !box.value && idx > 0) {
                    boxes[idx - 1].focus();
                }
            });
            // Handle paste
            box.addEventListener('paste', e => {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
                boxes.forEach((b, i) => { b.value = pasted[i] || ''; });
                if (pasted.length > 0) boxes[Math.min(pasted.length, 5)].focus();
                syncHidden();
            });
        });

        function syncHidden() {
            document.getElementById('otp-hidden').value = Array.from(boxes).map(b => b.value).join('');
        }

        // Focus first box on load
        boxes[0].focus();

        // Form submit validation
        document.getElementById('otp-form').addEventListener('submit', function (e) {
            const otp = document.getElementById('otp-hidden').value;
            if (otp.length !== 6) {
                e.preventDefault();
                alert('Please enter all 6 digits of the OTP.');
            }
        });

        /* ── Countdown Timer (10 min) ── */
        let totalSeconds = 10 * 60;
        const timerEl = document.getElementById('timer');
        const verifyBtn = document.getElementById('verify-btn');
        const countdown = setInterval(() => {
            totalSeconds--;
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
            if (totalSeconds <= 0) {
                clearInterval(countdown);
                timerEl.textContent = 'Expired';
                timerEl.style.color = '#c0392b';
                verifyBtn.disabled = true;
                verifyBtn.style.opacity = '0.5';
            }
        }, 1000);
    </script>
</body>

</html>
